name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code with submodules (ESSENTIAL)
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      # 3. Set up Emscripten (installs and caches the SDK)
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.17 # Use a recent version or the one you use locally
          actions-cache-folder: 'emsdk-cache'

      # 4. Install Ninja and CMake (already available on ubuntu-latest, but added for safety)
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      # 5. Install NPM dependencies
      - name: Install NPM dependencies
        run: npm ci

      # 6. Full build (Configure -> Extractor -> Generate -> TS)
      - name: Build Project
        run: npm run build

      # 7. (Optional but RECOMMENDED) Check for uncommitted files
      # If the generated .ts file differs from the committed one, the build fails.
      # This keeps the C++ and TS sources in sync.
      - name: Check for unsynced changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Error: The generated files are out of sync with C++ sources."
            echo "Please run 'npm run generate' locally and commit the changes."
            git status
            git diff
            exit 1
          fi
