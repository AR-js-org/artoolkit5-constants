name: CI Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    # The same image `npm run build:docker` uses locally — not merely the same
    # Emscripten version installed a different way. The build regenerates the
    # constants and the last step fails if the result differs from what is
    # committed, so "builds here" and "builds in CI" have to be the same thing.
    #
    # Keep this tag in step with .emscripten-version; the first step fails loudly
    # if they drift. It cannot read the file directly: `container` is resolved
    # before the repository is checked out.
    container: emscripten/emsdk:4.0.17

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The checkout is owned by a different user than this container runs as,
      # which trips git's dubious-ownership guard — and the sync check below is
      # a git command, so it would fail for the wrong reason.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify the toolchain matches the pin
        run: |
          PINNED="$(cat .emscripten-version)"
          ACTUAL="$(emcc --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"

          if [ "$PINNED" != "$ACTUAL" ]; then
            echo "::error::.emscripten-version says $PINNED but this container has emcc $ACTUAL."
            echo "Update the 'container:' tag in this workflow and .emscripten-version together."
            exit 1
          fi

          echo "Emscripten $ACTUAL matches .emscripten-version."
          node --version

      - name: Install NPM dependencies
        run: npm ci

      # Configure -> extractor -> generate -> TypeScript
      - name: Build Project
        run: npm run build

      # The generated constants are committed. If a build produces something
      # different, either the C++ changed without the output being regenerated,
      # or the toolchain is not what it claims to be. Both should stop the build.
      - name: Check for unsynced changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The generated files are out of sync with the C++ sources."
            echo "Run 'npm run build:docker' locally and commit the result."
            git status
            git diff
            exit 1
          fi
          echo "Generated output matches the committed files."
